<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{sitename}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body class="{{bodyclass}}">
<!-- 共有スクリプトはページ内スクリプトより先に評価される必要があるので body 先頭に置く
     (defer や末尾配置だと、ページ内の初期化コードのほうが先に走ってしまう) -->
{{scripts}}

<header id="site-header">
  <a class="brand" href="{{root}}">{{sitename}}</a>
  <!-- 入口はここ一箇所 (UI整理 F2)。<details> なので JS なしでも開閉でき、
       リンクは常に DOM にあるので検索エンジンからも辿れる。 -->
  <details id="menu">
    <summary aria-label="メニューを開く">メニュー</summary>
    <nav>{{nav}}</nav>
  </details>
</header>

{{content}}

<!-- ページへの導線はヘッダのメニューに集約したので、フッタは帰属表示だけに絞る (UI整理 F2) -->
<footer id="site-footer">
  星表 <a href="https://github.com/astronexus/HYG-Database">HYG Database</a> (CC BY-SA 2.5) /
  星座線・天の川 <a href="https://github.com/ofrohn/d3-celestial">d3-celestial</a> (BSD-3-Clause)
  — <a href="{{root}}credits/">出典とライセンス</a>
</footer>

<!-- メニューは外側タップと Esc で閉じる (details 単体だと閉じないため。開閉自体は CSS/HTML で成立) -->
<script>
(function () {
  var m = document.getElementById("menu");
  if (!m) return;
  document.addEventListener("click", function (e) { if (!m.contains(e.target)) m.open = false; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") m.open = false; });
})();
</script>

<!-- アクセス解析: GoatCounter (Cookieなし・同意バナー不要)。
     広告ブロッカーに弾かれる分は実訪問より少なめに出る。
     ダッシュボード: https://tomoakiitoh.goatcounter.com/ -->
<script data-goatcounter="https://tomoakiitoh.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
