<script type="importmap">
{ "imports": { "three": "../assets/three.module.min.js" } }

<script type="module">
import * as THREE from "three";
// astro.js: raDecToVec / skyMatrix / applySky / skyMatrixNoPrecession / planetPosition /
//   moonPosition / moonTopocentric / sunPosition / julianDay / jdFromDate。data.js/sites.js。
// 星の方向は早見盤とまったく同じ (e,n,u)。VRでは (e, u, -n) 方向に置くだけ。

const R = 100;                 // 天球半径 (無限遠の代用。大きさは相対的なので任意)
const TZ_MIN = 9 * 60;         // JST
const el = (id) => document.getElementById(id);

// ---- シーン ----
const canvas = el("pl-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.xr.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040a);
const camera = new THREE.PerspectiveCamera(72, 1, 0.1, R * 4);
camera.position.set(0, 1.6, 0);        // 中心に立つ (目の高さ)。VRでは頭が視点

// 天球グループ: 恒星・星座線・天の川を J2000 の向きで入れておき、
// このグループの行列を skyMatrix にすることで日時・場所ぶん一括で回す。
const skyGroup = new THREE.Group();
skyGroup.matrixAutoUpdate = false;
scene.add(skyGroup);

// B-V → おおよその星の色
function bvRGB(bv) {
  const A = [[-0.4, 0.61, 0.70, 1.0], [0.0, 0.79, 0.85, 1.0], [0.4, 1.0, 0.98, 0.94],
             [0.8, 1.0, 0.93, 0.80], [1.3, 1.0, 0.84, 0.67], [2.0, 1.0, 0.76, 0.60]];
  bv = Math.max(A[0][0], Math.min(A[A.length - 1][0], bv || 0));
  for (let i = 1; i < A.length; i++) {
    if (bv <= A[i][0]) {
      const t = (bv - A[i - 1][0]) / (A[i][0] - A[i - 1][0]);
      return [1, 2, 3].map((k) => A[i - 1][k] + t * (A[i][k] - A[i - 1][k]));
    }
  }
  return [1, 1, 1];
}

// ---- 恒星 (シェーダで等級ごとに大きさ、B-Vで色) ----
const STAR_VERT = `
attribute float aSize; attribute vec3 aColor; attribute float aBright;
varying vec3 vColor; varying float vBright;
void main(){ vColor=aColor; vBright=aBright;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize; }`;
const STAR_FRAG = `
precision mediump float; varying vec3 vColor; varying float vBright;
void main(){ vec2 d=gl_PointCoord-vec2(0.5); float r2=dot(d,d); if(r2>0.25) discard;
  float m=smoothstep(0.25,0.0,r2);           // 丸くソフトな点
  gl_FragColor=vec4(vColor*vBright*m, 1.0);   // 加算合成: 明るさは等級由来。密集で天の川が光る
}`;
// 等級 → 見かけの大きさ・明るさ。明暗差を大きく取り、星座(明るい星)が埋もれないように。
const starSize = (mag) => Math.max(1.2, Math.min(13.0, 1.3 + Math.max(0, 5.5 - mag) * 1.35));
// ≒ 実際の光度比。暗い星に下限を与え、天の川の密集域で加算されて帯が光るようにする。
const starBright = (mag) => Math.min(8.0, Math.max(0.06, Math.pow(2.512, 4.2 - mag)));
const starMaterial = () => new THREE.ShaderMaterial({
  vertexShader: STAR_VERT, fragmentShader: STAR_FRAG,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

{
  const n = STARS.length;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const siz = new Float32Array(n), bri = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = STARS[i];               // [ra, dec, mag, B-V]
    const v = raDecToVec(s[0], s[1]);
    pos[i * 3] = v[0] * R; pos[i * 3 + 1] = v[1] * R; pos[i * 3 + 2] = v[2] * R;
    const c = bvRGB(s[3]); col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    siz[i] = starSize(s[2]); bri[i] = starBright(s[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(siz, 1));
  g.setAttribute("aBright", new THREE.BufferAttribute(bri, 1));
  const stars = new THREE.Points(g, starMaterial());
  stars.frustumCulled = false;
  skyGroup.add(stars);
}

// ---- 深い星 V≤10 (全天一括ロード。stars_deep.bin = ra f32, dec f32, magQ u8, bvQ u8) ----
let deepStars = null;
function loadDeepStars() {
  fetch("../stars_deep.bin").then((r) => r.arrayBuffer()).then((buf) => {
    const dv = new DataView(buf), n = Math.floor(buf.byteLength / 10);
    const MLO = 5, MHI = 10, BLO = -0.5, BHI = 2.5;   // build_stars.py の量子化レンジ
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const siz = new Float32Array(n), bri = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const o = i * 10;
      const ra = dv.getFloat32(o, true), dec = dv.getFloat32(o + 4, true);
      const mag = MLO + dv.getUint8(o + 8) / 255 * (MHI - MLO);
      const bv = BLO + dv.getUint8(o + 9) / 255 * (BHI - BLO);
      const v = raDecToVec(ra, dec);
      pos[i * 3] = v[0] * R; pos[i * 3 + 1] = v[1] * R; pos[i * 3 + 2] = v[2] * R;
      const c = bvRGB(bv); col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
      siz[i] = starSize(mag); bri[i] = starBright(mag);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(siz, 1));
    g.setAttribute("aBright", new THREE.BufferAttribute(bri, 1));
    deepStars = new THREE.Points(g, starMaterial());
    deepStars.frustumCulled = false;
    deepStars.visible = el("pl-deep").checked;
    skyGroup.add(deepStars);
    el("pl-deep").parentElement.classList.remove("loading");
  }).catch(() => { el("pl-deep").parentElement.classList.remove("loading"); });
}
el("pl-deep").parentElement.classList.add("loading");
loadDeepStars();

// ---- 星座線 ----
const constLines = (() => {
  const pts = [];
  for (const [, polylines] of CONST_LINES) {
    for (const line of polylines) {
      for (let i = 0; i + 1 < line.length; i++) {
        for (const p of [line[i], line[i + 1]]) {
          const v = raDecToVec(p[0], p[1]);
          pts.push(v[0] * R, v[1] * R, v[2] * R);
        }
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
  const line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color: 0x2f4a78, transparent: true, opacity: 0.55 }));
  line.frustumCulled = false; skyGroup.add(line); return line;
})();

// ---- 天の川 (簡易: 等高線を淡い線で。phase2 で作り込み) ----
const milkyway = (() => {
  const pts = [];
  for (const level of MILKYWAY) for (const ring of level) {
    for (let i = 0; i + 1 < ring.length; i++) {
      for (const p of [ring[i], ring[i + 1]]) {
        const v = raDecToVec(p[0], p[1]); pts.push(v[0] * R, v[1] * R, v[2] * R);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
  const line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color: 0x1c2740, transparent: true, opacity: 0.5 }));
  line.frustumCulled = false; skyGroup.add(line); return line;
})();
milkyway.visible = false;   // 深い星で本物の天の川が出るので、輪郭線は既定オフ

// ---- 星座名スプライト ----
function makeLabel(text, color, size = 0.5) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.font = "30px sans-serif"; g.fillStyle = color; g.textAlign = "center";
  g.textBaseline = "middle"; g.fillText(text, 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthTest: false, depthWrite: false }));
  sp.scale.set(size * 4, size, 1); return sp;
}
const constNames = new THREE.Group(); skyGroup.add(constNames);
// CONST_NAMES は [略号, 和名, ra, dec] の4要素。ここを [ra, dec, name] として展開していたため、
// 赤経に "And" のような文字列が入って座標が NaN になり、星座名が一度も出ていなかった。
for (const [, ja, ra, dec] of CONST_NAMES) {
  const v = raDecToVec(ra, dec);
  const sp = makeLabel(ja, "#8aa0c8", R * 0.02);
  sp.position.set(v[0] * R * 0.98, v[1] * R * 0.98, v[2] * R * 0.98);
  constNames.add(sp);
}
constNames.visible = false;

// ---- 地面・地平線・方位 (観測者フレーム。天球と一緒には回さない) ----
const ground = new THREE.Mesh(new THREE.CircleGeometry(R * 2, 64),
  new THREE.MeshBasicMaterial({ color: 0x05070d, side: THREE.DoubleSide }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.4; scene.add(ground);

const horizon = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints(
    Array.from({ length: 128 }, (_, i) => {
      const a = i / 128 * Math.PI * 2; return new THREE.Vector3(Math.sin(a) * R, 0, -Math.cos(a) * R);
    })),
  new THREE.LineBasicMaterial({ color: 0x33507f, transparent: true, opacity: 0.6 }));
scene.add(horizon);

// 方位: 北=-z, 東=+x, 南=+z, 西=-x
for (const [name, x, z, color] of [["北", 0, -1, "#ff8a8a"], ["東", 1, 0, "#dfe8ff"],
  ["南", 0, 1, "#dfe8ff"], ["西", -1, 0, "#dfe8ff"]]) {
  const sp = makeLabel(name, color, R * 0.04);
  sp.position.set(x * R * 0.9, 1.5, z * R * 0.9); scene.add(sp);
}

// ---- 惑星・月・太陽 (観測者フレームに毎回置き直す) ----
const bodyDefs = [
  ["sun", "太陽", 0xffdf70, 3.0], ["moon", "月", 0xdfe6f0, 2.6],
  ["Mercury", "水星", 0xcfd3d8, 1.4], ["Venus", "金星", 0xfdf6e0, 2.2],
  ["Mars", "火星", 0xf0705a, 1.6], ["Jupiter", "木星", 0xf5e6bf, 2.0],
  ["Saturn", "土星", 0xe9d27a, 1.8],
];
const bodyGroup = new THREE.Group(); scene.add(bodyGroup);
const bodies = bodyDefs.map(([id, ja, color, mag]) => {
  // 太陽・月は約0.5°の円盤、惑星は小さめの点。R*0.0016*mag ≈ 見かけの大きさの目安
  const m = new THREE.Mesh(new THREE.SphereGeometry(R * 0.0016 * mag, 16, 16),
    new THREE.MeshBasicMaterial({ color }));
  const label = makeLabel(ja, "#" + color.toString(16).padStart(6, "0"), R * 0.03);
  const grp = new THREE.Group(); grp.add(m); grp.add(label);
  label.position.y = R * 0.03; bodyGroup.add(grp);
  return { id, grp };
});

// ---- 動的ラベル (テキストが変わったときだけ描き直す) ----
// 彗星・衛星は時刻で顔ぶれが変わるので、makeLabel のように毎回テクスチャを作ると
// 時間送り中にテクスチャを作り続けてしまう。プール + 差分更新にする。
function makeDynLabel(color, size) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false }));
  sp.scale.set(size * 4, size, 1);
  let cur = null;
  sp.setText = (t) => {
    if (t === cur) return;
    cur = t;
    g.clearRect(0, 0, 256, 64);
    g.font = "30px sans-serif"; g.fillStyle = color;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(t, 128, 34);
    tex.needsUpdate = true;
  };
  return sp;
}

// にじみ (コマ・衛星の光) 用の共有テクスチャ。中心が明るい放射グラデーション。
function glowTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(0.35, "rgba(255,255,255,0.45)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const GLOW_TEX = glowTexture();

// ---- 彗星 (早見盤とまったく同じ計算: astro.js の orbitalToRaDec + cometMagnitude) ----
const COMET_MAG_LIMIT = 13.5;   // 早見盤と同じしきい値
const COMET_MAX = 60;           // VRの負荷を抑える上限 (明るい順)。超えたぶんは出さない
// 描く彗星には全部名前を出す。実測では 13.5等以下は同時に数個しかなく (2026-07-27 は
// 10P/Tempel の1個だけ)、文字が氾濫する心配がないため。名前が無いと VR では
// 「かすかな点」が何なのか分からず、機能として意味を成さない。
const COMET_LABEL_MAG = COMET_MAG_LIMIT;
let comets = null, cometsHistoric = null, cometsTried = false;
let cometCache = { jd: null, list: [] };
const cometGroup = new THREE.Group(); scene.add(cometGroup); cometGroup.visible = false;
const cometPool = [];

/** 彗星の符号を照合キーに正規化 (早見盤と同じ。現行と歴史の重複を防ぐ)。 */
function desigKey(s) {
  s = s.trim();
  let m = s.match(/^(\d+[PDI])\b/);
  if (m) return m[1];
  m = s.match(/^([CPXAI]\/\d{4}\s+[A-Z]{1,2}\d*(?:-[A-Z])?)/);
  if (m) return m[1].replace(/\s+/g, " ");
  return s.split(" (")[0].trim();
}

function loadComets() {
  if (cometsTried) return;
  cometsTried = true;
  const get = (u) => fetch(u).then((r) => (r.ok ? r.json() : Promise.reject(r.status))).catch(() => null);
  Promise.all([get("../comets.json"), get("../comets_historic.json")]).then(([a, b]) => {
    comets = a; cometsHistoric = b; cometCache.jd = null; update();
  });
}

/** その日時の彗星の位置・等級 (現行＋歴史。日付でキャッシュ)。早見盤の cometPositions と同じ。 */
function cometPositions(jd) {
  if (cometCache.jd != null && Math.abs(jd - cometCache.jd) < 0.1) return cometCache.list;
  const list = [];
  for (const c of (comets || [])) {
    const g = orbitalToRaDec({ e: c[1], q: c[2], i: c[3], node: c[4], peri: c[5], tp: c[6] }, jd);
    const mag = cometMagnitude(c[7], c[8], g.r, g.delta);
    if (!isFinite(mag) || mag > COMET_MAG_LIMIT) continue;
    list.push({ name: c[0], ra: g.ra, dec: g.dec, mag });
  }
  // 歴史的な肉眼彗星は出現期(窓)の中だけ。長周期要素を遠い日時へ外挿しない。
  if (cometsHistoric) {
    const shown = new Set(list.map((x) => desigKey(x.name)));
    for (const c of cometsHistoric) {
      if (jd < c[9] || jd > c[10] || shown.has(desigKey(c[0]))) continue;
      const g = orbitalToRaDec({ e: c[1], q: c[2], i: c[3], node: c[4], peri: c[5], tp: c[6] }, jd);
      const mag = cometMagnitude(c[7], c[8], g.r, g.delta);
      if (!isFinite(mag) || mag > COMET_MAG_LIMIT) continue;
      list.push({ name: c[11] || c[0], ra: g.ra, dec: g.dec, mag });   // 和名優先
    }
  }
  list.sort((a, b) => a.mag - b.mag);          // 明るい順
  cometCache = { jd, list: list.slice(0, COMET_MAX) };
  return cometCache.list;
}

function cometMarker() {
  const grp = new THREE.Group();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX, color: 0x8cffcd, transparent: true, opacity: 0.75,
    depthTest: false, depthWrite: false }));
  const label = makeDynLabel("#8cffcd", R * 0.028);
  label.position.y = R * 0.035;
  grp.add(glow); grp.add(label);
  cometGroup.add(grp);
  return { grp, glow, label };
}

function updateComets(Mn) {
  if (!cometGroup.visible) return;
  loadComets();
  const list = (comets || cometsHistoric) ? cometPositions(curJd) : [];
  for (let i = 0; i < list.length; i++) {
    if (!cometPool[i]) cometPool[i] = cometMarker();
    const mk = cometPool[i], c = list[i];
    const h = applySky(Mn, raDecToVec(c.ra, c.dec));
    if (h.u <= -0.05) { mk.grp.visible = false; continue; }
    mk.grp.visible = true;
    mk.grp.position.copy(toDir(h).multiplyScalar(R * 0.95));
    // 明るいほど大きく。等級 0→約2.2、13→約0.5 (相対的な目安)
    const s = R * 0.004 * Math.max(0.5, 2.4 - 0.15 * c.mag);
    mk.glow.scale.set(s * 4, s * 4, 1);
    if (c.mag <= COMET_LABEL_MAG) {
      mk.label.visible = true;
      mk.label.setText(c.name.split(" (")[0]);
    } else {
      mk.label.visible = false;
    }
  }
  for (let i = list.length; i < cometPool.length; i++) cometPool[i].grp.visible = false;
}

// ---- 人工衛星 (PLAN6 と同じ SGP4: satellite.js。地平座標を直接得る) ----
const SAT_FRESH_DAYS = 2;      // TLE の鮮度。表示時刻がこれ以上ずれたら出さない
const SAT_LABELS = 8;          // 名前を出すのは標準等級を持つ著名機だけ (ISS/CSS/HST…)
const EARTH_R_KM = 6378.137;
let satLib = null, satRecs = null, satTried = false, satXYZ = null;
const satGroup = new THREE.Group(); scene.add(satGroup); satGroup.visible = false;
const satGeom = new THREE.BufferGeometry();
const satPoints = new THREE.Points(satGeom, new THREE.PointsMaterial({
  map: GLOW_TEX, size: R * 0.014, color: 0xffe9b0, transparent: true,
  depthTest: false, depthWrite: false, sizeAttenuation: true }));
satGroup.add(satPoints);
const satLabels = [];

function loadSats() {
  if (satTried) return;
  satTried = true;
  Promise.all([
    import("../assets/satellite.es.js"),
    fetch("../satellites.json").then((r) => (r.ok ? r.json() : Promise.reject(r.status))),
  ]).then(([lib, data]) => {
    satLib = lib;
    satRecs = [];
    for (const [name, norad, l1, l2, stdMag] of data) {
      const satrec = lib.twoline2satrec(l1, l2);
      if (satrec.error) continue;
      satRecs.push({ name: name.trim(), satrec, stdMag });
    }
    // 頂点バッファは最大機数ぶん一度だけ確保する。毎フレーム作り直すと VR (72Hz) で
    // GC が走ってカクつくため、以降は中身を書き換えて drawRange で本数を変える。
    satXYZ = new Float32Array(satRecs.length * 3);
    satGeom.setAttribute("position", new THREE.BufferAttribute(satXYZ, 3));
    update();
  }).catch(() => { /* 衛星データが無くても他は動く */ });
}

/** 衛星が日照中か (簡易円柱影。地球影に入った衛星は光らない=見えない)。 */
function satSunlit(pos, sun) {
  const dot = pos.x * sun[0] + pos.y * sun[1] + pos.z * sun[2];
  if (dot > 0) return true;
  return Math.hypot(pos.x - dot * sun[0], pos.y - dot * sun[1], pos.z - dot * sun[2]) > EARTH_R_KM;
}

function updateSats() {
  if (!satGroup.visible) return;
  loadSats();
  const stale = Math.abs(curJd - jdFromDate(new Date())) > SAT_FRESH_DAYS;
  if (!satRecs || stale) {          // 鮮度外は「出さない」(TLEを遠い日時へ外挿しない)
    satPoints.visible = false;
    for (const l of satLabels) l.visible = false;
    return;
  }
  satPoints.visible = true;
  const date = new Date((curJd - 2440587.5) * 86400000);
  const gmst = satLib.gstime(date);
  const obs = { longitude: site.lon * Math.PI / 180, latitude: site.lat * Math.PI / 180, height: 0.05 };
  const s = sunPosition(curJd), sunV = raDecToVec(s.ra, s.dec);
  let n = 0;
  const named = [];
  for (const st of satRecs) {
    const pv = satLib.propagate(st.satrec, date);
    if (!pv.position) continue;                       // 元期から離れすぎ等の伝播エラー
    const look = satLib.ecfToLookAngles(obs, satLib.eciToEcf(pv.position, gmst));
    if (look.elevation < 0) continue;                 // 地平線下
    if (!satSunlit(pv.position, sunV)) continue;      // 地球影の中は見えない (=見えない衛星は出さない)
    const ca = Math.cos(look.elevation);
    const d = toDir({ e: ca * Math.sin(look.azimuth), n: ca * Math.cos(look.azimuth),
                      u: Math.sin(look.elevation) }).multiplyScalar(R * 0.93);
    satXYZ[n * 3] = d.x; satXYZ[n * 3 + 1] = d.y; satXYZ[n * 3 + 2] = d.z;
    n++;
    if (st.stdMag != null && named.length < SAT_LABELS) named.push({ name: st.name, d });
  }
  satGeom.attributes.position.needsUpdate = true;
  satGeom.setDrawRange(0, n);
  satPoints.frustumCulled = false;    // 位置を直接書くのでバウンディングは当てにしない
  for (let i = 0; i < SAT_LABELS; i++) {
    if (!satLabels[i]) {
      const l = makeDynLabel("#ffe9b0", R * 0.026);
      satGroup.add(l); satLabels[i] = l;
    }
    const s = named[i];
    satLabels[i].visible = !!s;
    if (s) {
      satLabels[i].setText(s.name);
      satLabels[i].position.copy(s.d);
      satLabels[i].position.y += R * 0.03;
    }
  }
}

// ---- 状態と更新 ----
let site = loadSite();
let curJd = jdFromDate(new Date());

// (e,n,u) 行列 M → three の回転 A·M ([e→x, u→y, -n→z])
function setSkyMatrix(M) {
  const m = new THREE.Matrix4();
  m.set(M[0][0], M[0][1], M[0][2], 0,
        M[2][0], M[2][1], M[2][2], 0,
        -M[1][0], -M[1][1], -M[1][2], 0,
        0, 0, 0, 1);
  skyGroup.matrix.copy(m);
}
const toDir = (h) => new THREE.Vector3(h.e, h.u, -h.n);   // 地平成分 → three 方向

function update() {
  const M = skyMatrix(curJd, site.lat, site.lon);
  setSkyMatrix(M);
  const Mn = skyMatrixNoPrecession(curJd, site.lat, site.lon);
  // 惑星・月・太陽
  for (const b of bodies) {
    let rd;
    if (b.id === "sun") rd = sunPosition(curJd);
    else if (b.id === "moon") rd = moonTopocentric(moonPosition(curJd), curJd, site.lat, site.lon);
    else rd = planetPosition(b.id, curJd);
    const h = applySky(Mn, raDecToVec(rd.ra, rd.dec));
    b.grp.visible = h.u > -0.05;                 // 地平線下は隠す
    b.grp.position.copy(toDir(h).multiplyScalar(R * 0.96));
  }
  updateComets(Mn);   // 彗星 (早見盤と同じ軌道要素・等級式)
  updateSats();       // 人工衛星 (SGP4。鮮度の窓の中だけ)
  // 日時表示
  const d = new Date((curJd - 2440587.5) * 86400000 + TZ_MIN * 60000);
  const p2 = (n) => String(n).padStart(2, "0");
  el("pl-info").textContent =
    `${site.name}　${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())} JST`;
}

// ---- 日時コントロール ----
function syncControls() {
  const d = new Date((curJd - 2440587.5) * 86400000 + TZ_MIN * 60000);
  const p2 = (n) => String(n).padStart(2, "0");
  el("pl-date").value = `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`;
  el("pl-time").value = d.getUTCHours() * 60 + d.getUTCMinutes();
}
function jdFromControls() {
  const [y, m, dd] = el("pl-date").value.split("-").map(Number);
  const min = Number(el("pl-time").value);
  return julianDay(y, m, dd, min / 60 - 9);      // JST → UT
}
el("pl-date").addEventListener("change", () => { curJd = jdFromControls(); update(); });
el("pl-time").addEventListener("input", () => { curJd = jdFromControls(); update(); });
el("pl-now").addEventListener("click", () => { curJd = jdFromDate(new Date()); syncControls(); update(); });

el("pl-deep").addEventListener("change", () => { if (deepStars) deepStars.visible = el("pl-deep").checked; });
el("pl-lines").addEventListener("change", () => constLines.visible = el("pl-lines").checked);
el("pl-names").addEventListener("change", () => constNames.visible = el("pl-names").checked);
el("pl-planets").addEventListener("change", () => bodyGroup.visible = el("pl-planets").checked);
el("pl-mw").addEventListener("change", () => milkyway.visible = el("pl-mw").checked);
el("pl-comets").addEventListener("change", () => {
  cometGroup.visible = el("pl-comets").checked; update();
});
el("pl-sats").addEventListener("change", () => {
  satGroup.visible = el("pl-sats").checked; update();
});

// 観測地
fillSiteSelect(el("pl-site"), site);
el("pl-site").addEventListener("change", () => {
  const v = el("pl-site").value;
  const cust = v === "custom";
  for (const e of document.querySelectorAll(".pl-cust")) e.hidden = !cust;
  if (!cust) {
    const [lat, lon] = v.split(",").map(Number);
    const name = el("pl-site").selectedOptions[0].textContent;
    site = { name, lat, lon }; saveSite(site); update();
  }
});
for (const id of ["pl-lat", "pl-lon"]) el(id).addEventListener("change", () => {
  site = { name: "現在地", lat: Number(el("pl-lat").value), lon: Number(el("pl-lon").value) };
  el("pl-lat").value = site.lat; el("pl-lon").value = site.lon; saveSite(site); update();
});

// ---- 再生 (時間送り = 日周運動) ----
let playing = false, lastT = 0;
el("pl-play").addEventListener("click", () => {
  playing = !playing; el("pl-play").textContent = playing ? "■" : "▶"; lastT = 0;
});

// ---- デスクトップの見回し (VRでは頭が視点) ----
let yaw = Math.PI, pitch = 0.35, dragging = false, px = 0, py = 0;   // 初期=南を見上げる
canvas.addEventListener("pointerdown", (e) => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", (e) => {
  if (!dragging || renderer.xr.isPresenting) return;
  yaw -= (e.clientX - px) * 0.004; pitch -= (e.clientY - py) * 0.004;
  pitch = Math.max(-1.45, Math.min(1.45, pitch)); px = e.clientX; py = e.clientY;
});

// ---- 描画ループ ----
function resize() {
  if (renderer.xr.isPresenting) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
// VR中のコントローラ操作: スティック左右で時間送り、A/X(またはトリガ)で「今」に戻す
let vrPrevReset = false, vrPrevMenu = false;
function vrInput(dt) {
  const s = renderer.xr.getSession();
  if (!s) return false;
  let stick = 0, reset = false, menu = false;
  for (const src of s.inputSources) {
    const gp = src.gamepad;
    if (!gp) continue;
    const ax = gp.axes.length >= 4 ? gp.axes[2] : (gp.axes[0] || 0);  // サムスティックX
    if (Math.abs(ax) > Math.abs(stick)) stick = ax;
    // A / X は常に「今」。トリガーはパネルを開いている間はボタン押しに使うので除く。
    if (gp.buttons[4] && gp.buttons[4].pressed) reset = true;
    if (!uiPanel.visible && gp.buttons[0] && gp.buttons[0].pressed) reset = true;
    if (gp.buttons[5] && gp.buttons[5].pressed) menu = true;          // B / Y = パネル開閉
  }
  if (menu && !vrPrevMenu) setVrPanel(!uiPanel.visible);
  vrPrevMenu = menu;
  let changed = false;
  if (Math.abs(stick) > 0.15) { curJd += stick * Math.abs(stick) * 0.3 * dt; changed = true; }  // 全倒し≒6時間/秒
  if (reset && !vrPrevReset) { curJd = jdFromDate(new Date()); changed = true; }
  vrPrevReset = reset;
  return changed;
}

let prevNow = 0;
function tick(now) {
  resize();
  const dt = prevNow ? Math.min(0.1, (now - prevNow) / 1000) : 0; prevNow = now;
  let changed = false;
  if (playing) { curJd += (Number(el("pl-speed").value) / 1440) * dt; changed = true; }  // 分/秒→日
  if (renderer.xr.isPresenting) { if (vrInput(dt)) changed = true; updateVrHover(); }
  else { camera.rotation.set(pitch, yaw, 0, "YXZ"); camera.position.set(0, 1.6, 0); }
  if (changed) { syncControls(); update(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

syncControls();
update();

/* ---- VR内のメニューパネル ----
   ヘッドセットを被ったままレイヤを切り替えるためのパネル。コントローラから伸びるレイで指し、
   トリガーで押す。状態は画面下のチェックボックスを唯一の源にし (VR側では持たない)、
   押されたら el(id).click() で既存のハンドラをそのまま動かす = 二重管理にならない。
   ?vrpanel=1 を付けると、ヘッドセット無しでも同じパネルをデスクトップで確認・操作できる。 */
const VR_ROWS = [
  { id: "pl-lines", label: "星座線" },
  { id: "pl-names", label: "星座名" },
  { id: "pl-deep", label: "深い星 V≤10" },
  { id: "pl-planets", label: "惑星・月" },
  { id: "pl-mw", label: "天の川" },
  { id: "pl-comets", label: "彗星" },
  { id: "pl-sats", label: "人工衛星" },
  { act: "pl-play", label: "時間送り（再生／停止）" },
  { act: "pl-now", label: "「今」に戻す" },
];
const UI_W = 512, UI_H = 700, UI_TOP = 78, UI_ROW = 62;

const uiCanvas = document.createElement("canvas");
uiCanvas.width = UI_W; uiCanvas.height = UI_H;
const uiCtx = uiCanvas.getContext("2d");
const uiTex = new THREE.CanvasTexture(uiCanvas);
const uiPanel = new THREE.Mesh(
  new THREE.PlaneGeometry(0.62, 0.62 * UI_H / UI_W),
  new THREE.MeshBasicMaterial({ map: uiTex, transparent: true, depthTest: false, depthWrite: false }));
uiPanel.renderOrder = 9000;      // ラベル類が depthTest:false なので、最後に描いて手前に出す
uiPanel.visible = false;
scene.add(uiPanel);

function rr(g, x, y, w, h, r) {
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawVrUi(hover = -1) {
  const g = uiCtx;
  g.clearRect(0, 0, UI_W, UI_H);
  rr(g, 1, 1, UI_W - 2, UI_H - 2, 20);
  g.fillStyle = "rgba(8,13,26,0.94)"; g.fill();
  g.strokeStyle = "#35589c"; g.lineWidth = 2; g.stroke();
  g.textBaseline = "middle";
  g.fillStyle = "#e6eeff"; g.font = "bold 27px sans-serif";
  g.fillText("表示設定", 26, 42);
  g.fillStyle = "#7c88a3"; g.font = "16px sans-serif";
  g.textAlign = "right"; g.fillText("B / Y ボタンで開閉", UI_W - 26, 42); g.textAlign = "left";

  VR_ROWS.forEach((r, i) => {
    const y = UI_TOP + i * UI_ROW;
    const on = r.id ? el(r.id).checked : false;
    rr(g, 18, y, UI_W - 36, UI_ROW - 8, 11);
    g.fillStyle = i === hover ? "rgba(53,88,156,0.65)" : "rgba(19,27,48,0.92)"; g.fill();
    g.strokeStyle = on ? "#35589c" : "#1d2437"; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = r.act ? "#cfe0ff" : (on ? "#e6eeff" : "#7c88a3");
    g.font = "22px sans-serif";
    g.fillText(r.label, 40, y + (UI_ROW - 8) / 2);
    if (r.id) {                                  // トグル行だけ ON/OFF のピルを出す
      const pw = 62, px = UI_W - 36 - pw - 14;
      rr(g, px, y + 12, pw, 30, 15);
      g.fillStyle = on ? "#23407a" : "#131b30"; g.fill();
      g.strokeStyle = on ? "#6ea8ff" : "#2a3450"; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = on ? "#e6eeff" : "#6b7890"; g.font = "bold 16px sans-serif";
      g.textAlign = "center"; g.fillText(on ? "ON" : "OFF", px + pw / 2, y + 27); g.textAlign = "left";
    }
  });
  uiTex.needsUpdate = true;
}

/** パネルを視線の正面 (水平方向) に置く。見上げていても足元に回り込まないようにする。 */
function placeVrPanel() {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  if (!renderer.xr.isPresenting) {
    // デスクトップ確認用: カメラの向きは描画ループ内で毎フレーム入れ直しているので、
    // ここで先に反映させないと「向いていない方向」にパネルを置いてしまう。
    camera.rotation.set(pitch, yaw, 0, "YXZ");
    camera.position.set(0, 1.6, 0);
  }
  cam.updateMatrixWorld();
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  cam.getWorldPosition(p); cam.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
  fwd.normalize();
  uiPanel.position.copy(p).addScaledVector(fwd, 1.3);
  uiPanel.position.y = p.y - 0.02;     // ほぼ目の高さ (下げすぎると下端が視野から外れる)
  uiPanel.lookAt(p);
}

let vrHover = -1;
function setVrPanel(v) {
  uiPanel.visible = v;
  if (v) { placeVrPanel(); vrHover = -1; drawVrUi(); }
}
function rowFromUv(uv) {
  const y = (1 - uv.y) * UI_H;                   // uv は下が0、canvas は上が0
  const i = Math.floor((y - UI_TOP) / UI_ROW);
  return (y >= UI_TOP && i >= 0 && i < VR_ROWS.length) ? i : -1;
}
function activateVrRow(i) {
  const r = VR_ROWS[i];
  if (!r) return;
  el(r.id || r.act).click();                     // 既存のハンドラをそのまま動かす
  drawVrUi(i);
}
// 画面下のパネルで切り替えたときも、VRパネルの ON/OFF 表示を合わせる
for (const r of VR_ROWS) {
  el(r.id || r.act).addEventListener(r.id ? "change" : "click",
    () => { if (uiPanel.visible) drawVrUi(vrHover); });
}

// ---- コントローラ (レイで指してトリガーで押す) ----
const uiRay = new THREE.Raycaster();
const uiMat4 = new THREE.Matrix4();
const controllers = [];
function setupControllers() {
  if (controllers.length) return;
  for (const i of [0, 1]) {
    const c = renderer.xr.getController(i);
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color: 0x6ea8ff, transparent: true, opacity: 0.85,
                                    depthTest: false }));
    line.renderOrder = 9001; line.scale.z = 3;
    c.add(line);
    c.addEventListener("selectstart", () => {
      if (!uiPanel.visible) return;
      const hit = hitFromController(c);
      if (hit) { const r = rowFromUv(hit.uv); if (r >= 0) activateVrRow(r); }
    });
    scene.add(c);
    controllers.push(c);
  }
}
function hitFromController(c) {
  uiMat4.identity().extractRotation(c.matrixWorld);
  uiRay.ray.origin.setFromMatrixPosition(c.matrixWorld);
  uiRay.ray.direction.set(0, 0, -1).applyMatrix4(uiMat4);
  return uiRay.intersectObject(uiPanel, false)[0] || null;
}
/** レイが当たっている行をハイライトする (毎フレーム。変化したときだけ描き直す)。 */
function updateVrHover() {
  if (!uiPanel.visible || !renderer.xr.isPresenting) return;
  let h = -1;
  for (const c of controllers) {
    const hit = hitFromController(c);
    if (hit) { h = rowFromUv(hit.uv); break; }
  }
  if (h !== vrHover) { vrHover = h; drawVrUi(h); }
}

// ---- ヘッドセット無しでの確認用 (?vrpanel=1): マウスを同じレイとして扱う ----
if (new URLSearchParams(location.search).get("vrpanel") === "1") setVrPanel(true);
function hitFromMouse(e) {
  const r = canvas.getBoundingClientRect();
  uiRay.setFromCamera(new THREE.Vector2(
    ((e.clientX - r.left) / r.width) * 2 - 1,
    -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  return uiRay.intersectObject(uiPanel, false)[0] || null;
}
canvas.addEventListener("pointermove", (e) => {
  if (!uiPanel.visible || renderer.xr.isPresenting) return;
  const hit = hitFromMouse(e);
  const h = hit ? rowFromUv(hit.uv) : -1;
  if (h !== vrHover) { vrHover = h; drawVrUi(h); }
});
canvas.addEventListener("click", (e) => {
  if (!uiPanel.visible || renderer.xr.isPresenting) return;
  const hit = hitFromMouse(e);
  if (!hit) return;
  const r = rowFromUv(hit.uv);
  if (r >= 0) activateVrRow(r);
});

// ---- VRモード (WebXR: 天球の中心に立って見上げる) ----
setupVR();
function setupVR() {
  const btn = el("pl-vr");
  if (!navigator.xr) return;
  navigator.xr.isSessionSupported("immersive-vr").then((ok) => {
    if (!ok) return;
    btn.hidden = false;
    let session = null;
    btn.addEventListener("click", async () => {
      if (session) { session.end(); return; }
      try {
        session = await navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor"] });
      } catch (e) { alert("VRを開始できませんでした。Quest のブラウザで開いてください。"); return; }
      renderer.xr.setReferenceSpaceType("local-floor");  // 立って見上げる=床基準
      await renderer.xr.setSession(session);
      btn.textContent = "VRを終了";
      setupControllers();
      setVrPanel(true);        // 最初は出しておく (出し方が分からないと設定を変えられないため)
      session.addEventListener("end", () => {
        session = null; btn.textContent = "VRで見る"; setVrPanel(false);
      });
    });
  });
}
</script>
