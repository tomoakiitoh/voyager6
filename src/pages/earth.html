<!--
title: 地球周回3D
description: 人工衛星の軌道を地球中心の3Dで俯瞰する。ISS など明るい衛星が地球のまわりをどう回るかを時間再生で見る。SGP4 で計算。
scripts: astro.js
bodyclass: solar-page
-->
<div id="solar-wrap"><canvas id="solar-canvas"></canvas></div>

<div id="solar-panel">
  <div class="row">
    <span id="earth-date" class="info"></span>
    <span class="grow"></span>
    <button id="earth-vr" hidden>VRで見る</button>
    <button id="earth-now" class="primary">今</button>
  </div>
  <div class="row">
    <input type="range" id="earth-time" min="-720" max="720" step="0.5" value="0">
  </div>
  <div class="row">
    <button id="earth-play" title="再生 / 停止">▶</button>
    <select id="earth-speed" title="再生速度">
      <option value="1">1分/秒</option>
      <option value="10" selected>10分/秒</option>
      <option value="60">1時間/秒</option>
    </select>
    <input type="text" id="earth-search" placeholder="衛星名 / NORAD で選択" maxlength="30">
    <button id="earth-search-btn">選択</button>
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="earth-line" checked>線画で描く</label>
    <label><input type="checkbox" id="earth-fixjp">日本を正面に固定</label>
    <label><input type="checkbox" id="earth-guides" checked>GEO軌道の輪・グリッド</label>
    <label><input type="checkbox" id="earth-orbit" checked>選択衛星の軌道</label>
    <label><input type="checkbox" id="earth-starlink">Starlink網</label>
  </div>
  <div class="row"><span id="earth-pick" class="info">読み込み中…</span></div>
</div>

<script type="importmap">
{ "imports": { "three": "../assets/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "../assets/OrbitControls.js";

// astro.js のグローバル (sunPosition / raDecToVec / jdFromDate) を使う。
// 衛星の位置は satellite.js の SGP4 (早見盤 F1 と同じ。Vallado 参照実装と照合済み)。
const el = (id) => document.getElementById(id);
const K = 1 / 1000;                 // km → three.js 単位 (1単位=1000km)
const EARTH_R = 6371 * K;           // 地球半径
const GEO_R = 42164 * K;            // 静止軌道半径
const TZ_MIN = 9 * 60;

// ECI(TEME) km (x,y,z) → three.js (地球の自転軸=ECI z を three の上(y)に)
const toV = (p) => new THREE.Vector3(p.x * K, p.z * K, -p.y * K);

const canvas = el("solar-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.xr.enabled = true;         // WebXR (VRモード)
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 4000);
camera.position.set(0, 24, 58);     // 静止軌道(42単位)まで見える俯瞰
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0x99aacc, 1.5));   // 夜側も地球と分かる程度に持ち上げる

// 地球と衛星を全部載せる器。VR ではこの world ごと縮小して目の前に浮かべる
// (太陽系3D と同じ考え方)。太陽光も中に入れておかないと、縮めたとき昼夜の向きがずれる。
const world = new THREE.Group();
scene.add(world);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
world.add(sunLight);
world.add(sunLight.target);

// ---- 地球 (テクスチャ＋昼夜。自転は GMST で回す) ----
const earthTex = new THREE.TextureLoader().load("../assets/earth.jpg");
earthTex.colorSpace = THREE.SRGBColorSpace;
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_R, 64, 48),
  new THREE.MeshPhongMaterial({ map: earthTex, shininess: 8 }));
world.add(earth);
// 赤道リング (静止軌道) と赤道面グリッド (向きの手がかり)
const guides = new THREE.Group();
world.add(guides);
const geoPts = [];
for (let d = 0; d <= 360; d += 2) geoPts.push(new THREE.Vector3(GEO_R * Math.cos(d * Math.PI / 180), 0, GEO_R * Math.sin(d * Math.PI / 180)));
guides.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(geoPts),
  new THREE.LineBasicMaterial({ color: 0x884444, transparent: true, opacity: 0.5 })));
guides.add(new THREE.PolarGridHelper(GEO_R, 8, 6, 64, 0x223, 0x18213a));

/* ---- 線画モード ----
   写真テクスチャは 1024x512 しかなく、拡大すると眠い。海岸線を線で描いたほうが
   このサイトの見た目 (静かな星図) にも合う。球体は暗い無地にして裏側の線を隠し、
   昼夜の陰影だけ残す。海岸線は地球の子にするので、自転にそのまま乗る。
   地球ローカル座標: 経度λ・緯度φ → r(cosλcosφ, sinφ, −sinλcosφ)
   (three.js の SphereGeometry の UV と一致する向き。λ=0 が +x、λ=+90° が −z) */
const earthPhotoMat = earth.material;
const earthDarkMat = new THREE.MeshPhongMaterial({ color: 0x0b1a2e, shininess: 0 });
let coastLines = null, coastTried = false;

/* 海岸線の色で昼夜を表す。頂点の位置ベクトルは「地球中心から見たその地点の向き」
   そのものなので、太陽方向との内積を取れば昼夜が決まる。頂点ごとに色を CPU で
   塗り直すと 12万頂点ぶんの書き換えが毎フレーム走るので、GPU 側 (頂点シェーダ) で
   計算する。uSun は「地球ローカル系での太陽の向き」で、自転ぶんは CPU 側で外してから渡す。 */
const coastMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    uSun: { value: new THREE.Vector3(1, 0, 0) },
    uDay: { value: new THREE.Color(0xdff0ff) },     // 昼側: 明るい白青
    uNight: { value: new THREE.Color(0x2b5a8f) },   // 夜側: 沈んだ青
    uOpacity: { value: 0.95 },
  },
  vertexShader: `
    uniform vec3 uSun;
    uniform vec3 uDay;
    uniform vec3 uNight;
    varying vec3 vCol;
    void main() {
      float t = smoothstep(-0.12, 0.12, dot(normalize(position), uSun));  // 境目をやわらかく
      vCol = mix(uNight, uDay, t);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uOpacity;
    varying vec3 vCol;
    void main() { gl_FragColor = vec4(vCol, uOpacity); }`,
});

async function loadCoastlines() {
  if (coastTried) return;
  coastTried = true;
  try {
    const buf = await fetch("../coastlines.bin")
      .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(r.status)));
    const dv = new DataView(buf);
    let o = 0;
    const nLines = dv.getUint32(o, true); o += 4;
    const rr = EARTH_R * 1.002;            // わずかに浮かせて z-fighting を避ける
    const pos = [];
    for (let i = 0; i < nLines; i++) {
      const m = dv.getUint16(o, true); o += 2;
      let px = 0, py = 0, pz = 0;
      for (let k = 0; k < m; k++) {
        const lon = (dv.getUint16(o, true) / 65535) * 360 - 180; o += 2;
        const lat = (dv.getUint16(o, true) / 65535) * 180 - 90; o += 2;
        const a = lon * Math.PI / 180, b = lat * Math.PI / 180, cb = Math.cos(b);
        const x = rr * Math.cos(a) * cb, y = rr * Math.sin(b), z = -rr * Math.sin(a) * cb;
        if (k > 0) pos.push(px, py, pz, x, y, z);    // LineSegments 用に線分で積む
        px = x; py = y; pz = z;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    coastLines = new THREE.LineSegments(g, coastMat);
    earth.add(coastLines);                 // 地球の子 = 自転に乗る
    applyEarthStyle();
  } catch (e) { /* 線画データが無ければ写真のまま */ }
}

function applyEarthStyle() {
  const line = el("earth-line").checked;
  earth.material = line ? earthDarkMat : earthPhotoMat;
  if (coastLines) coastLines.visible = line;
  if (line) loadCoastlines();
}

// 地軸 (北極の向き)
guides.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -EARTH_R * 1.6, 0), new THREE.Vector3(0, EARTH_R * 1.6, 0)]),
  new THREE.LineBasicMaterial({ color: 0x3a4a6a })));

// ---- 衛星 ----
let satLib = null, sats = [], satPoints = null, satColors = null;
let selected = -1;
const selMarker = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff }));
selMarker.visible = false;
world.add(selMarker);
let orbitLine = null;

// 軌道高度で色分け (LEO=シアン / MEO=橙 / GEO付近=赤)
function regimeColor(altKm) {
  if (altKm > 30000) return [1.0, 0.45, 0.4];
  if (altKm > 4000) return [1.0, 0.75, 0.35];
  return [0.42, 0.86, 1.0];
}

async function loadSats() {
  try {
    const [lib, data] = await Promise.all([
      import("../assets/satellite.es.js"),
      fetch("../satellites.json").then((r) => (r.ok ? r.json() : Promise.reject(r.status))),
    ]);
    satLib = lib;
    for (const [name, norad, l1, l2, stdMag] of data) {
      const satrec = lib.twoline2satrec(l1, l2);
      if (satrec.error) continue;
      sats.push({ name: name.trim(), norad, satrec, stdMag });
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(sats.length * 3), 3));
    satColors = new Float32Array(sats.length * 3);
    geo.setAttribute("color", new THREE.BufferAttribute(satColors, 3));
    satPoints = new THREE.Points(geo, new THREE.PointsMaterial({
      // sizeAttenuation:false = 画面上のピクセル固定。0.5px では点にもならず見えなかった
      size: 4.5, sizeAttenuation: false, vertexColors: true, map: dot(), transparent: true, depthWrite: false }));
    world.add(satPoints);
    el("earth-pick").textContent = `${sats.length} 機を表示中。衛星をクリックで軌道表示`;
    selectFromUrl();
    update();
  } catch (e) {
    el("earth-pick").textContent = "衛星データを読み込めませんでした。";
  }
}

// Starlink 網 (大きいのでオンデマンド。間引いて ~3000 機を表示 = コンステレーション網)
let starRecs = [], starPoints = null, starTried = false;
async function loadStarlink() {
  if (starTried || !satLib) return;
  starTried = true;
  try {
    const data = await fetch("../satellites_starlink.json").then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
    const step = Math.max(1, Math.ceil(data.length / 3000));
    for (let i = 0; i < data.length; i += step) {
      const rec = satLib.twoline2satrec(data[i][2], data[i][3]);
      if (!rec.error) starRecs.push(rec);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(starRecs.length * 3), 3));
    starPoints = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 2.2, sizeAttenuation: false, color: 0x9fb8d0, map: dot(),
      transparent: true, opacity: 0.7, depthWrite: false }));
    starPoints.visible = el("earth-starlink").checked;
    world.add(starPoints);
    update();
  } catch (e) { /* Starlink 無しでも動く */ }
}

/** 丸い柔らかい点スプライト。 */
function dot() {
  const s = 64, c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.5, "rgba(255,255,255,0.85)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); g.fill();
  return new THREE.CanvasTexture(c);
}

// ---- 時間 ----
const baseMs = Date.now();
let curMs = baseMs;
let playing = false, lastT = 0;

function eciOf(satrec, date) {
  const pv = satLib.propagate(satrec, date);
  return pv.position ? pv.position : null;   // ECI km
}

/** 選択衛星の軌道線 (1周ぶんを ECI でサンプル。ECI では軌道はほぼ固定)。 */
function buildOrbit(s) {
  if (orbitLine) { world.remove(orbitLine); orbitLine.geometry.dispose(); orbitLine = null; }
  const periodMin = (2 * Math.PI) / s.satrec.no;   // no = 平均運動 [rad/min]
  const pts = [];
  for (let k = 0; k <= 180; k++) {
    const d = new Date(curMs + (k / 180) * periodMin * 60000);
    const p = eciOf(s.satrec, d);
    if (p) pts.push(toV(p));
  }
  orbitLine = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x7fe0ff, transparent: true, opacity: 0.9 }));
  orbitLine.visible = el("earth-orbit").checked;
  world.add(orbitLine);
}

function selectSat(i) {
  selected = i;
  buildOrbit(sats[i]);
  update();
}

function selectFromUrl() {
  const q = new URLSearchParams(location.search).get("sat");
  if (!q) return;
  const key = q.trim().toLowerCase();
  let i = sats.findIndex((s) => String(s.norad) === key);
  if (i < 0) i = sats.findIndex((s) => s.name.toLowerCase().includes(key));
  if (i >= 0) selectSat(i);
}

function update() {
  const date = new Date(curMs);
  const jd = jdFromDate(date);
  lastGmst = satLib ? satLib.gstime(date) : 0;
  earth.rotation.y = lastGmst;                           // 自転
  applyWorldSpin();
  // 太陽方向 (ECI) → 平行光
  const s = sunPosition(jd);
  const sv = raDecToVec(s.ra, s.dec);
  sunLight.position.copy(new THREE.Vector3(sv[0], sv[2], -sv[1]).multiplyScalar(200));
  // 同じ太陽方向を「地球ローカル系」に直して海岸線シェーダへ渡す (自転ぶんを外す)。
  // ECI(X,Y,Z) → 緯度φ=asin(Z)、経度λ=atan2(Y,X)−GMST → ローカル(cosλcosφ, sinφ, −sinλcosφ)
  {
    const phi = Math.asin(Math.max(-1, Math.min(1, sv[2])));
    const lam = Math.atan2(sv[1], sv[0]) - lastGmst;
    const cp = Math.cos(phi);
    coastMat.uniforms.uSun.value.set(Math.cos(lam) * cp, Math.sin(phi), -Math.sin(lam) * cp);
  }

  if (satPoints && satLib) {
    const pos = satPoints.geometry.getAttribute("position");
    for (let i = 0; i < sats.length; i++) {
      const p = eciOf(sats[i].satrec, date);
      if (!p) { pos.setXYZ(i, 0, 0, 0); continue; }
      const v = toV(p);
      pos.setXYZ(i, v.x, v.y, v.z);
      const alt = Math.hypot(p.x, p.y, p.z) - 6371;
      const c = regimeColor(alt);
      satColors[i * 3] = c[0]; satColors[i * 3 + 1] = c[1]; satColors[i * 3 + 2] = c[2];
    }
    pos.needsUpdate = true;
    satPoints.geometry.getAttribute("color").needsUpdate = true;
  }
  if (starPoints && starPoints.visible) {
    const pos = starPoints.geometry.getAttribute("position");
    for (let i = 0; i < starRecs.length; i++) {
      const p = eciOf(starRecs[i], date);
      if (!p) { pos.setXYZ(i, 0, 0, 0); continue; }
      const v = toV(p); pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
  }
  if (selected >= 0 && satLib) {
    const p = eciOf(sats[selected].satrec, date);
    if (p) {
      selMarker.position.copy(toV(p)); selMarker.visible = true;
      const alt = Math.hypot(p.x, p.y, p.z) - 6371;
      const pv = satLib.propagate(sats[selected].satrec, date);
      const spd = Math.hypot(pv.velocity.x, pv.velocity.y, pv.velocity.z);
      const period = (2 * Math.PI) / sats[selected].satrec.no;
      el("earth-pick").textContent =
        `★ ${sats[selected].name}　高度 ${alt.toFixed(0)} km ・ 速度 ${spd.toFixed(2)} km/s ・ 周期 ${period.toFixed(0)}分 ・ NORAD ${sats[selected].norad}`;
    }
  }
  const d = new Date(curMs + TZ_MIN * 60000);
  el("earth-date").textContent =
    `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")} `
    + `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")} JST`;
}

/* ---- 日本を正面に固定 ----
   衛星は ECI (慣性系) にいるので、地球は時間とともに回っていく。日本の上空を誰が通るのかを
   見たいときは、地球ごと回して日本をこちら (カメラ側 = three の +z) に向けたまま止める。
   経度λの地点は GMST+λ の方向にいるので、world を −90°−(GMST+λ) だけ回すと +z を向く。 */
const JP_LON = 139.77 * Math.PI / 180;      // 東京
let lastGmst = 0, vrSpin = 0, vrZoom = 1;
function applyWorldSpin() {
  const fix = el("earth-fixjp").checked ? (-Math.PI / 2 - (lastGmst + JP_LON)) : 0;
  world.rotation.y = vrSpin + fix;
}

// ---- UI ----
function setOffset(min) { curMs = baseMs + min * 60000; update(); }
el("earth-time").addEventListener("input", () => setOffset(Number(el("earth-time").value)));
el("earth-now").addEventListener("click", () => { curMs = Date.now(); el("earth-time").value = 0; update(); });
el("earth-line").addEventListener("change", applyEarthStyle);
el("earth-fixjp").addEventListener("change", () => {
  if (el("earth-fixjp").checked && !renderer.xr.isPresenting) {
    // 日本 (北緯35.7°) の真上から見下ろす位置にカメラを置く。経度は world 側で
    // 正面に向けてあるので、あとは緯度ぶん持ち上げれば日本が画面中央に来る。
    const d = 62.8, la = 35.68 * Math.PI / 180;
    camera.position.set(0, d * Math.sin(la), d * Math.cos(la));
    controls.target.set(0, 0, 0); controls.update();
  }
  update();
});
el("earth-guides").addEventListener("change", () => (guides.visible = el("earth-guides").checked));
el("earth-orbit").addEventListener("change", () => { if (orbitLine) orbitLine.visible = el("earth-orbit").checked; });
el("earth-starlink").addEventListener("change", () => {
  const on = el("earth-starlink").checked;
  if (on && !starPoints) loadStarlink();
  if (starPoints) starPoints.visible = on;
});
function searchSat() {
  const q = el("earth-search").value.trim().toLowerCase();
  if (!q) return;
  let i = sats.findIndex((s) => String(s.norad) === q);
  if (i < 0) i = sats.findIndex((s) => s.name.toLowerCase().includes(q));
  if (i >= 0) selectSat(i); else el("earth-pick").textContent = "見つかりません";
}
el("earth-search-btn").addEventListener("click", searchSat);
el("earth-search").addEventListener("keydown", (e) => { if (e.key === "Enter") searchSat(); });
el("earth-play").addEventListener("click", () => {
  playing = !playing; el("earth-play").textContent = playing ? "■" : "▶"; lastT = 0;
});

// クリックで最寄りの衛星を選択
canvas.addEventListener("click", (ev) => {
  if (!satPoints) return;
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const pos = satPoints.geometry.getAttribute("position");
  const v = new THREE.Vector3();
  let best = -1, bestD = 16 * 16;
  for (let i = 0; i < sats.length; i++) {
    v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).project(camera);
    if (v.z > 1) continue;
    const sx = (v.x * 0.5 + 0.5) * rect.width, sy = (-v.y * 0.5 + 0.5) * rect.height;
    const d = (sx - mx) ** 2 + (sy - my) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best >= 0) selectSat(best);
});

/* ---- VRモード (WebXR: 地球と衛星群を目の前に浮かべて眺める) ----
   太陽系3D と同じで、world ごと縮めて頭の正面に置く。縮尺は「静止軌道の輪が
   目の前に収まり、地球が抱えられる大きさの球に見える」ところを狙う。
   衛星の点は sizeAttenuation:false (画面上のピクセル固定) なので、縮めても消えない。 */
// 静止軌道の輪が頭の前に収まる範囲で、地球をできるだけ大きく見せる縮尺。
// (GEO半径は地球半径の6.6倍あるので、輪を前に収める限り地球は見かけ14°前後が上限)
const VR_SCALE = 0.03;               // 42,164km(GEO半径) → 約1.26m
const VR_DIST = 1.55;                // 頭の正面 約1.55m先 (輪の手前側でも約0.3m先)

let vrPrevReset = false;
function vrInput(dt) {
  const s = renderer.xr.getSession();
  if (!s) return;
  // 右スティック横=時間送り、左スティック横=地球を回す・縦=拡大縮小。
  // (VR では視点を動かせないので、回せないと裏側が見えず、寄れないと細部が見えない)
  // A/X で「今」・向き・倍率をまとめて戻す。
  let stick = 0, spin = 0, zoom = 0, reset = false;
  for (const src of s.inputSources) {
    const gp = src.gamepad;
    if (!gp) continue;
    const ax = gp.axes.length >= 4 ? gp.axes[2] : (gp.axes[0] || 0);   // サムスティックX
    const ay = gp.axes.length >= 4 ? gp.axes[3] : 0;                   // サムスティックY (上が負)
    if (src.handedness === "left") {
      if (Math.abs(ax) > Math.abs(spin)) spin = ax;
      if (Math.abs(ay) > Math.abs(zoom)) zoom = ay;
    } else if (Math.abs(ax) > Math.abs(stick)) stick = ax;
    if (gp.buttons[4] && gp.buttons[4].pressed) reset = true;          // A / X
  }
  if (Math.abs(spin) > 0.15) { vrSpin += spin * Math.abs(spin) * 1.2 * dt; applyWorldSpin(); }
  if (Math.abs(zoom) > 0.15) {                 // 前に倒す=寄る。指数で効かせて等比に変える
    vrZoom = Math.max(0.35, Math.min(8, vrZoom * Math.exp(-zoom * 1.5 * dt)));
    world.scale.setScalar(VR_SCALE * vrZoom);
  }
  if (Math.abs(stick) > 0.15) {      // 全倒しで約2時間/秒
    let min = (curMs - baseMs) / 60000 + stick * Math.abs(stick) * 120 * dt;
    min = Math.max(-720, Math.min(720, min));
    curMs = baseMs + min * 60000;
    el("earth-time").value = min;
    update();
  }
  if (reset && !vrPrevReset) {
    curMs = baseMs; el("earth-time").value = 0;
    vrSpin = 0; vrZoom = 1; world.scale.setScalar(VR_SCALE); update();
  }
  vrPrevReset = reset;
}

function enterVR(saved) {
  saved.scale = world.scale.x;
  saved.pos = world.position.clone();
  vrZoom = 1;
  world.scale.setScalar(VR_SCALE);
  world.position.set(0, 0, -VR_DIST);
  controls.enabled = false;
  // Starlink 網は間引いても約3000機。SGP4 を毎フレーム回すと 72Hz に間に合わないので
  // VR 中は退避して切る (実測: 176機で0.57ms → 3000機なら約10ms で予算13.9msを圧迫)。
  saved.starlink = el("earth-starlink").checked;
  if (saved.starlink) { el("earth-starlink").checked = false; el("earth-starlink").dispatchEvent(new Event("change")); }
  // 止まっていると「回っている」ことが伝わらないので、ゆっくり再生しておく
  saved.playing = playing; saved.speed = el("earth-speed").value;
  el("earth-speed").value = "10"; lastT = 0;
  playing = true; el("earth-play").textContent = "■";
}
function exitVR(saved) {
  world.scale.setScalar(saved.scale);
  world.position.copy(saved.pos);
  vrSpin = 0; applyWorldSpin();      // VR中に回した向きは持ち帰らない
  controls.enabled = true;
  if (saved.starlink) { el("earth-starlink").checked = true; el("earth-starlink").dispatchEvent(new Event("change")); }
  el("earth-speed").value = saved.speed;
  playing = saved.playing; el("earth-play").textContent = playing ? "■" : "▶";
}

/* ヘッドセット無しで縮尺と配置を確かめるための簡易プレビュー (?vrpreview=1)。
   VR と同じ world 変換をかけ、カメラを頭の位置 (原点・-z 向き) に固定する。
   WebXR は手元で検証できないので、大きさの当たりをここで付ける。 */
const VR_PREVIEW = new URLSearchParams(location.search).get("vrpreview") === "1";
if (VR_PREVIEW) {
  enterVR({});
  camera.position.set(0, 0, 0);
  camera.rotation.set(0, 0, 0);
  camera.fov = 70; camera.updateProjectionMatrix();   // ヘッドセットに近い画角
}

setupVR();
function setupVR() {
  const btn = el("earth-vr");
  if (!navigator.xr) return;         // WebXR 非対応ブラウザではボタンを出さない
  navigator.xr.isSessionSupported("immersive-vr").then((ok) => {
    if (!ok) return;
    btn.hidden = false;
    let session = null;
    const saved = {};
    btn.addEventListener("click", async () => {
      if (session) { session.end(); return; }
      try {
        session = await navigator.xr.requestSession("immersive-vr",
          { optionalFeatures: ["local-floor"] });
      } catch (e) { alert("VRを開始できませんでした。Quest のブラウザで開いてください。"); return; }
      renderer.xr.setReferenceSpaceType("local");   // 頭の初期位置が原点 (着席/立位どちらでも)
      await renderer.xr.setSession(session);
      btn.textContent = "VRを終了";
      enterVR(saved);
      session.addEventListener("end", () => {
        session = null; btn.textContent = "VRで見る"; exitVR(saved);
      });
    });
  });
}

function resize() {
  if (renderer.xr.isPresenting) return;      // VR中は XR 側がサイズを持つ
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
let prevNow = 0;
function tick(now) {
  resize();
  const dt = prevNow ? Math.min(0.1, (now - prevNow) / 1000) : 0; prevNow = now;
  if (playing && satLib) {
    const dt = lastT ? (now - lastT) / 1000 : 0; lastT = now;
    let min = (curMs - baseMs) / 60000 + dt * Number(el("earth-speed").value);
    min = Math.max(-720, Math.min(720, min));
    if (min >= 720 || min <= -720) { playing = false; el("earth-play").textContent = "▶"; }
    curMs = baseMs + min * 60000;
    el("earth-time").value = min;
    update();
  }
  if (renderer.xr.isPresenting) vrInput(dt);   // VR中は頭が視点。スティックで時間送り
  else if (!VR_PREVIEW) controls.update();     // プレビュー中は視点を動かさない
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);
applyEarthStyle();
loadSats();
</script>
