# vim: ft=conf et sw=4
#=======================================
# data.voyager6.net — 静的データ配信 (voyager6.net 本体は GitHub Pages)
#
#  方針 (planisphere: データ配信VPS移設_設計_20260725.md):
#   - 静的ファイルのみ。PHP も CGI も置かない = 攻撃面が小さい
#   - WordPress の DocumentRoot の外。KUSANAGI の fcache/bcache とリライトに巻き込まれない
#   - CORS 全開 (公開データのみを扱う)
#  ※ nginx の add_header は「そのブロックで1つでも書くと上位を全部捨てる」ので
#    location ごとに必要な分を書き切っている。
#---------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name data.voyager6.net;

    charset UTF-8;
    root /home/kusanagi/data.voyager6.net;

    # 証明書更新のため acme を先に置く (正規表現 location は location / より優先される)。
    # リダイレクトを server 直下の rewrite でやると .well-known まで飛んでしまうので
    # location / に閉じ込めている。
    include conf.d/acme.inc;

    location / { return 301 https://$host$request_uri; }
}

server {
    include conf.d/ssl_listen.inc;

    server_name data.voyager6.net;

    ssl_certificate     /etc/letsencrypt/live/data.voyager6.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.voyager6.net/privkey.pem;
    include conf.d/ssl.inc;

    access_log  /var/log/nginx/datav6_access.log main;
    error_log   /var/log/nginx/datav6_error.log warn;

    charset UTF-8;
    root /home/kusanagi/data.voyager6.net;
    autoindex off;

    include conf.d/acme.inc;

    # ---- 死活監視 ----
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # ---- 20等星図の深層タイル ----
    # パスに v1 が入っていて中身は変わらないので immutable で1年。
    # 作り直すときは v2 を掘る (住所は変えない原則)。
    location ^~ /stars/v1/ {
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # manifest だけは可変。ここを immutable にするとビルドし直しても
        # クライアントが古い層構成を見続け、タイルを取り違える。
        location = /stars/v1/manifest.json {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=300" always;
            gzip on;
            gzip_types application/json;
            try_files $uri =404;
        }
    }

    # ---- cron 更新の JSON (衛星・彗星・小惑星) ----
    location / {
        default_type application/json;
        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300"         always;

        if ($request_method = OPTIONS) { return 204; }

        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;

        try_files $uri =404;
    }
}
