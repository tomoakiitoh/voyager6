# data.voyager6.net — 静的データ配信 (KUSANAGI VPS)
#
# 置き場所: KUSANAGI の nginx が include している conf.d 配下。
#   実パスは `nginx -T | grep -n 'include.*conf'` で確認してから決める
#   (KUSANAGI 9 は /etc/nginx/conf.d/ のことが多いが、プロファイル配下を include する構成もある)。
# 反映:  nginx -t && systemctl reload nginx
#
# 方針 (データ配信VPS移設_設計_20260725.md):
#   - **静的ファイルのみ**。PHP も CGI も置かない = 攻撃面が小さい。
#   - WordPress の DocumentRoot 配下には置かない (KUSANAGI の fcache/bcache と
#     リライトに巻き込まれるため、専用の root を持つ独立 server ブロックにする)。
#   - CORS は全開 (Access-Control-Allow-Origin: *)。扱うのは公開データのみ。

server {
    listen 80;
    listen [::]:80;
    server_name data.voyager6.net;

    # certbot の webroot 認証だけは 80 で通す (リダイレクトより前に置くこと)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                     # nginx 1.25 以降の書き方。1.24 以前なら
                                  # この行を消して listen を `443 ssl http2;` にする
    server_name data.voyager6.net;

    root /home/kusanagi/data.voyager6.net;
    autoindex off;                # ディレクトリ一覧は出さない
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/data.voyager6.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.voyager6.net/privkey.pem;

    access_log /var/log/nginx/data.voyager6.net.access.log;
    error_log  /var/log/nginx/data.voyager6.net.error.log;

    # nginx の add_header は「そのブロックで1つでも add_header を書くと
    # 上位の add_header を全部捨てる」。だから location ごとに必要な分を全部書く。

    # ---- 死活監視 ----
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # ---- 20等星図の深層タイル (stars/v1/) ----
    # パスに v1 が入っていてタイルは中身が変わらない = immutable で1年キャッシュしてよい。
    # 作り直すときは v2 を掘る (住所は変えない原則。既存 URL は生かしたまま増やす)。
    location ^~ /stars/v1/ {
        types { }                                   # 拡張子判定をやめて .bin を素通しする
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # manifest だけは可変。ここを immutable にするとビルドし直しても
        # クライアントが古い層構成を見続ける (タイルの取り違えになる)。
        location = /stars/v1/manifest.json {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=300" always;
            gzip on;
            gzip_types application/json;
            try_files $uri =404;
        }
    }

    # ---- cron 更新の JSON (衛星・彗星・小惑星) ----
    # 更新は日次なので 5 分キャッシュで十分。CDN は挟まない。
    location / {
        default_type application/json;
        add_header Access-Control-Allow-Origin  "*"           always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300"         always;

        # CORS プリフライト。単純GETなら本来飛んでこないが、来ても正しく返す。
        # (204 を返すときも上の add_header が要るので、この location の中で処理する)
        if ($request_method = OPTIONS) { return 204; }

        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;

        try_files $uri =404;
    }
}
