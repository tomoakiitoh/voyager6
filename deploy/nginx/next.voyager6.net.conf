# vim: ft=conf et sw=4
#=======================================
# next.voyager6.net — Current チャネル (main に混ぜる前に触る場所)
#
#  方針 (planisphere: next.voyager6.net_作業プラン_20260918.md):
#   - 静的ファイルのみ。GitHub Actions (next.yml) が branch `next` の dist を rsync で置く
#   - 検索避け: 全応答に X-Robots-Tag、robots.txt は Disallow、sitemap.xml は 404
#   - データ (衛星・タイル) はここに置かない。ページは data.voyager6.net から読む
#  ※ nginx の add_header は「そのブロックで1つでも書くと上位を全部捨てる」ので
#    location ごとに X-Robots-Tag を書き切っている。
#---------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name next.voyager6.net;

    charset UTF-8;
    root /home/kusanagi/next.voyager6.net;

    include conf.d/acme.inc;

    location / { return 301 https://$host$request_uri; }
}

server {
    include conf.d/ssl_listen.inc;

    server_name next.voyager6.net;

    ssl_certificate     /etc/letsencrypt/live/next.voyager6.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.voyager6.net/privkey.pem;
    include conf.d/ssl.inc;

    access_log  /var/log/nginx/nextv6_access.log main;
    error_log   /var/log/nginx/nextv6_error.log warn;

    charset UTF-8;
    root /home/kusanagi/next.voyager6.net;
    index index.html;
    autoindex off;

    include conf.d/acme.inc;

    # ---- 死活監視 ----
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok\n";
    }

    # ---- 検索避け ----
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /sitemap.xml { return 404; }

    # ---- サイト本体 (dist/ そのまま) ----
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=300" always;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain;
        gzip_min_length 1024;

        try_files $uri $uri/ =404;
    }
}
